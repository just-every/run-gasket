name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
      GASKET_VERIFY_SHARD: foundation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; action runtime Node 24
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0; action runtime Node 24
        with:
          node-version: '22.20.0'
          package-manager-cache: false
      - name: Check edition source lock freshness
        # Technical foundation exports use composition.lock.json or reference-export.json.
        # Edition-owned seeds commit sources.lock.json; Gasket is a composed foundation whose
        # edition.json only declares its public identity for the publication scan.
        if: ${{ hashFiles('sources.lock.json') != '' }}
        run: node scripts/edition-authoring/cli.mjs check
      - run: npm install --global pnpm@10.12.4
      - run: pnpm install --frozen-lockfile
      - run: pnpm run deps
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run verify

  # Keep this public-door migration/browser journey parallel to the existing
  # full suite so push validation stays within its 15-minute budget.
  agent-stock:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; action runtime Node 24
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0; action runtime Node 24
        with:
          node-version: '22.20.0'
          package-manager-cache: false
      - run: npm install --global pnpm@10.12.4
      - run: pnpm install --frozen-lockfile
      - run: pnpm run deps
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec rer build
      - run: |
          export STOCK_SCREENSHOTS="$RUNNER_TEMP/gasket-agent-stock"
          mkdir -p "$STOCK_SCREENSHOTS"
          pnpm run test:agent-stock

  # All four intake/label/triage journeys remain required on every push.
  requests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; action runtime Node 24
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0; action runtime Node 24
        with:
          node-version: '22.20.0'
          package-manager-cache: false
      - run: npm install --global pnpm@10.12.4
      - run: pnpm install --frozen-lockfile
      - run: pnpm run deps
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec rer build
      - run: |
          export REQUEST_SCREENSHOTS="$RUNNER_TEMP/gasket-requests"
          mkdir -p "$REQUEST_SCREENSHOTS"
          pnpm run test:requests

  # Preserve the shared fixture and archive comparison together; standalone
  # journeys use separate installations in required parallel shards.
  flows:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [core, automation, inventory, reports]
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
      GASKET_FLOWS_SHARD: ${{ matrix.shard }}
      PLANNING_SCREENSHOTS: /tmp/gasket-planning
      REPORT_SCREENSHOTS: /tmp/gasket-reports
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; action runtime Node 24
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0; action runtime Node 24
        with:
          node-version: '22.20.0'
          package-manager-cache: false
      - run: npm install --global pnpm@10.12.4
      - run: pnpm install --frozen-lockfile
      - run: pnpm run deps
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec rer build
      - run: pnpm run test:flows


  archive-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; action runtime Node 24
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0; action runtime Node 24
        with:
          node-version: '22.20.0'
          package-manager-cache: false
      - run: npm install --global pnpm@10.12.4
      - run: pnpm install --frozen-lockfile
      - run: pnpm run deps
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec rer build
      - run: |
          export GASKET_RECOVERY_SCREENSHOTS="$RUNNER_TEMP/gasket-recovery"
          mkdir -p "$GASKET_RECOVERY_SCREENSHOTS"
          node tests/gasket/recovery.mjs
